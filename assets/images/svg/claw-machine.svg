<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Machine body -->
  <rect x="180" y="60" width="240" height="260" rx="8" fill="#0f3460" stroke="#e94560" stroke-width="3"/>
  <!-- Glass front -->
  <rect x="195" y="100" width="210" height="180" rx="4" fill="#16213e" opacity="0.6"/>
  <!-- Claw rail -->
  <line x1="200" y1="80" x2="400" y2="80" stroke="#f5c518" stroke-width="3"/>
  <!-- Claw -->
  <g transform="translate(300,90)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#f5c518" stroke-width="2"/>
    <path d="M-12,30 Q-8,50 -4,30" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round"/>
    <path d="M4,30 Q8,50 12,30" fill="none" stroke="#f5c518" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="30" r="4" fill="#f5c518"/>
  </g>
  <!-- Prizes -->
  <circle cx="240" cy="230" r="14" fill="#e94560"/>
  <circle cx="280" cy="240" r="14" fill="#53d769"/>
  <circle cx="320" cy="235" r="14" fill="#f5c518"/>
  <circle cx="360" cy="245" r="14" fill="#e94560"/>
  <circle cx="260" cy="260" r="12" fill="#f5c518" opacity="0.7"/>
  <circle cx="340" cy="265" r="12" fill="#53d769" opacity="0.7"/>
  <!-- Stars -->
  <g fill="#f5c518" opacity="0.6">
    <polygon points="210,150 213,158 221,158 215,163 217,171 210,166 203,171 205,163 199,158 207,158"/>
    <polygon points="380,140 382,146 388,146 383,149 385,155 380,152 375,155 377,149 372,146 378,146"/>
  </g>
  <!-- Label -->
  <text x="300" y="340" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">Claw_Machine</text>
  <text x="300" y="368" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">Arcade WebGL Game</text>
</svg>