<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- PDF document -->
  <g transform="translate(260,80)">
    <rect x="0" y="0" width="80" height="110" rx="4" fill="#fff" opacity="0.95"/>
    <rect x="0" y="0" width="80" height="24" rx="4" fill="#e94560"/>
    <text x="40" y="17" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fff">PDF</text>
    <line x1="12" y1="38" x2="68" y2="38" stroke="#ccc" stroke-width="2"/>
    <line x1="12" y1="50" x2="68" y2="50" stroke="#ccc" stroke-width="2"/>
    <line x1="12" y1="62" x2="50" y2="62" stroke="#ccc" stroke-width="2"/>
    <line x1="12" y1="74" x2="60" y2="74" stroke="#ccc" stroke-width="2"/>
    <line x1="12" y1="86" x2="44" y2="86" stroke="#ccc" stroke-width="2"/>
  </g>
  <!-- Arrow -->
  <g transform="translate(370,120)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#f5c518" stroke-width="4" stroke-linecap="round"/>
    <polygon points="40,-8 56,0 40,8" fill="#f5c518"/>
  </g>
  <!-- Multiple PDFs (bulk) -->
  <g transform="translate(430,60)">
    <rect x="0" y="0" width="60" height="85" rx="3" fill="#fff" opacity="0.7"/>
    <rect x="0" y="0" width="60" height="18" rx="3" fill="#e94560"/>
    <text x="30" y="13" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#fff">PDF</text>
    <line x1="10" y1="28" x2="50" y2="28" stroke="#ccc" stroke-width="1.5"/>
    <line x1="10" y1="38" x2="50" y2="38" stroke="#ccc" stroke-width="1.5"/>
    <line x1="10" y1="48" x2="38" y2="48" stroke="#ccc" stroke-width="1.5"/>
  </g>
  <g transform="translate(440,70)">
    <rect x="0" y="0" width="60" height="85" rx="3" fill="#fff" opacity="0.5"/>
    <rect x="0" y="0" width="60" height="18" rx="3" fill="#e94560"/>
    <line x1="10" y1="28" x2="50" y2="28" stroke="#ccc" stroke-width="1.5"/>
    <line x1="10" y1="38" x2="50" y2="38" stroke="#ccc" stroke-width="1.5"/>
  </g>
  <!-- Template mapping arrows -->
  <g stroke="#53d769" stroke-width="2" fill="none" stroke-dasharray="4,3">
    <path d="M300,200 Q340,230 370,200"/>
    <path d="M300,220 Q340,250 370,220"/>
    <path d="M300,240 Q340,270 370,240"/>
  </g>
  <!-- Label -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">endowfill</text>
  <text x="300" y="340" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">PDF Mapping &amp; Bulk Generation</text>
</svg>