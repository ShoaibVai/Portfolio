<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- AR grid floor -->
  <g stroke="#0f3460" stroke-width="1" opacity="0.4">
    <line x1="100" y1="280" x2="500" y2="280"/>
    <line x1="130" y1="300" x2="470" y2="300"/>
    <line x1="160" y1="320" x2="440" y2="320"/>
    <line x1="190" y1="340" x2="410" y2="340"/>
    <line x1="220" y1="360" x2="380" y2="360"/>
    <line x1="150" y1="280" x2="220" y2="360"/>
    <line x1="230" y1="280" x2="280" y2="360"/>
    <line x1="310" y1="280" x2="320" y2="360"/>
    <line x1="380" y1="280" x2="360" y2="360"/>
    <line x1="450" y1="280" x2="400" y2="360"/>
  </g>
  <!-- Measurement line -->
  <g>
    <line x1="180" y1="200" x2="420" y2="200" stroke="#53d769" stroke-width="3" stroke-dasharray="8,4"/>
    <!-- Endpoints -->
    <circle cx="180" cy="200" r="6" fill="#53d769"/>
    <circle cx="420" cy="200" r="6" fill="#53d769"/>
    <!-- Dimension arrows -->
    <polygon points="180,192 170,200 180,208" fill="#53d769"/>
    <polygon points="420,192 430,200 420,208" fill="#53d769"/>
    <!-- Distance label -->
    <rect x="270" y="180" width="60" height="22" rx="4" fill="#0f3460" stroke="#53d769" stroke-width="2"/>
    <text x="300" y="196" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#53d769">2.4m</text>
  </g>
  <!-- Phone frame -->
  <g transform="translate(260,90)">
    <rect x="0" y="0" width="80" height="140" rx="10" fill="none" stroke="#e94560" stroke-width="3"/>
    <rect x="30" y="4" width="20" height="4" rx="2" fill="#e94560"/>
    <!-- Crosshair -->
    <line x1="40" y1="55" x2="40" y2="75" stroke="#53d769" stroke-width="2"/>
    <line x1="30" y1="65" x2="50" y2="65" stroke="#53d769" stroke-width="2"/>
    <circle cx="40" cy="65" r="12" fill="none" stroke="#53d769" stroke-width="1.5"/>
    <!-- AR dots -->
    <circle cx="20" cy="40" r="3" fill="#f5c518" opacity="0.8"/>
    <circle cx="60" cy="50" r="3" fill="#f5c518" opacity="0.8"/>
    <circle cx="25" cy="90" r="3" fill="#f5c518" opacity="0.8"/>
    <circle cx="55" cy="100" r="3" fill="#f5c518" opacity="0.8"/>
  </g>
  <!-- Label -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">AR-Measurement</text>
  <text x="300" y="340" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">Mobile AR Measuring App</text>
</svg>