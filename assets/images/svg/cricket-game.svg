<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Cricket bat -->
  <g transform="translate(270,100) rotate(-15)">
    <rect x="0" y="0" width="18" height="100" rx="3" fill="#c8a04e"/>
    <rect x="-4" y="95" width="26" height="50" rx="4" fill="#d4a843"/>
    <line x1="4" y1="105" x2="14" y2="105" stroke="#8b6914" stroke-width="1"/>
    <line x1="4" y1="115" x2="14" y2="115" stroke="#8b6914" stroke-width="1"/>
    <line x1="4" y1="125" x2="14" y2="125" stroke="#8b6914" stroke-width="1"/>
  </g>
  <!-- Cricket ball -->
  <g transform="translate(350,130)">
    <circle cx="0" cy="0" r="14" fill="#e94560"/>
    <path d="M-6,-12 Q0,-8 6,-12" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M-8,0 Q0,4 8,0" fill="none" stroke="#fff" stroke-width="1.5"/>
    <path d="M-6,12 Q0,8 6,12" fill="none" stroke="#fff" stroke-width="1.5"/>
  </g>
  <!-- Wickets -->
  <g transform="translate(410,170)">
    <rect x="-1" y="0" width="4" height="60" fill="#fff" opacity="0.9"/>
    <rect x="12" y="0" width="4" height="60" fill="#fff" opacity="0.9"/>
    <rect x="25" y="0" width="4" height="60" fill="#fff" opacity="0.9"/>
    <!-- Bails -->
    <rect x="-4" y="-4" width="14" height="4" rx="1" fill="#f5c518"/>
    <rect x="9" y="-4" width="14" height="4" rx="1" fill="#f5c518"/>
  </g>
  <!-- Terminal/CLI frame -->
  <g transform="translate(160,260)">
    <rect x="0" y="0" width="280" height="80" rx="6" fill="#0a0a1a" stroke="#53d769" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="20" rx="6" fill="#333"/>
    <circle cx="12" cy="10" r="4" fill="#e94560"/>
    <circle cx="26" cy="10" r="4" fill="#f5c518"/>
    <circle cx="40" cy="10" r="4" fill="#53d769"/>
    <!-- Terminal text -->
    <text x="12" y="38" font-family="monospace" font-size="11" fill="#53d769">> cricket_game --play</text>
    <text x="12" y="54" font-family="monospace" font-size="11" fill="#f5c518">Score: 45/2 (3.2 ov)</text>
    <text x="12" y="70" font-family="monospace" font-size="11" fill="#a8a8a8">Bat: 1 | Bowl: 0_</text>
  </g>
  <!-- Label -->
  <text x="300" y="370" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">CrickeTgame</text>
  <text x="300" y="395" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">CLI Cricket Mini-Game</text>
</svg>