<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#0f3460" stroke-width="1" opacity="0.3">
    <line x1="0" y1="50" x2="600" y2="50"/><line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/><line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/><line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/><line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/><line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
  </g>
  <!-- Plant/growth icon -->
  <g transform="translate(300,180)">
    <!-- Pot -->
    <rect x="-30" y="30" width="60" height="40" rx="4" fill="#e94560"/>
    <rect x="-38" y="24" width="76" height="12" rx="3" fill="#e94560"/>
    <!-- Stem -->
    <line x1="0" y1="24" x2="0" y2="-20" stroke="#53d769" stroke-width="4" stroke-linecap="round"/>
    <!-- Leaves -->
    <ellipse cx="-18" cy="-8" rx="16" ry="8" fill="#53d769" transform="rotate(-30 -18 -8)"/>
    <ellipse cx="18" cy="-16" rx="16" ry="8" fill="#53d769" transform="rotate(30 18 -16)"/>
    <ellipse cx="-14" cy="-30" rx="14" ry="7" fill="#53d769" transform="rotate(-20 -14 -30)"/>
    <ellipse cx="14" cy="-38" rx="14" ry="7" fill="#53d769" transform="rotate(20 14 -38)"/>
    <!-- AI sparkle -->
    <g transform="translate(40,-50)" fill="#f5c518">
      <polygon points="0,-8 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2"/>
    </g>
  </g>
  <!-- Label -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">growdev</text>
  <text x="300" y="340" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">AI Project Management</text>
</svg>