<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Robot/NPC head -->
  <g transform="translate(300,140)">
    <!-- Antenna -->
    <line x1="0" y1="-55" x2="0" y2="-70" stroke="#f5c518" stroke-width="3"/>
    <circle cx="0" cy="-74" r="6" fill="#f5c518"/>
    <!-- Head -->
    <rect x="-45" y="-55" width="90" height="75" rx="12" fill="#0f3460" stroke="#e94560" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="-18" cy="-25" r="10" fill="#53d769"/>
    <circle cx="18" cy="-25" r="10" fill="#53d769"/>
    <circle cx="-18" cy="-25" r="4" fill="#fff"/>
    <circle cx="18" cy="-25" r="4" fill="#fff"/>
    <!-- Mouth -->
    <rect x="-20" y="0" width="40" height="6" rx="3" fill="#e94560"/>
  </g>
  <!-- Chat bubbles -->
  <g transform="translate(370,100)">
    <rect x="0" y="0" width="100" height="35" rx="8" fill="#e94560" opacity="0.9"/>
    <text x="50" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#fff">Hello!</text>
  </g>
  <g transform="translate(130,155)">
    <rect x="0" y="0" width="110" height="35" rx="8" fill="#0f3460" stroke="#53d769" stroke-width="2"/>
    <text x="55" y="22" text-anchor="middle" font-family="monospace" font-size="11" fill="#53d769">How can I help?</text>
  </g>
  <!-- Brain / AI symbol -->
  <g transform="translate(300,260)" fill="none" stroke="#f5c518" stroke-width="2">
    <circle cx="0" cy="0" r="18"/>
    <path d="M-10,-10 Q0,-18 10,-10"/>
    <path d="M-12,0 Q0,12 12,0"/>
    <path d="M-8,8 Q0,16 8,8"/>
  </g>
  <!-- Label -->
  <text x="300" y="310" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">CustomerCareAI</text>
  <text x="300" y="340" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">NPC AI Chatbot with LLM</text>
</svg>