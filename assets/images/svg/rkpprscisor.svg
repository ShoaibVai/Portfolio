<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Rock -->
  <g transform="translate(160,160)">
    <ellipse cx="0" cy="0" rx="45" ry="38" fill="#e94560"/>
    <ellipse cx="-10" cy="-8" rx="18" ry="12" fill="#c73a52" opacity="0.5"/>
    <text x="0" y="55" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#e94560">ROCK</text>
  </g>
  <!-- Paper -->
  <g transform="translate(300,140)">
    <rect x="-38" y="-40" width="76" height="80" rx="4" fill="#f5c518"/>
    <line x1="-24" y1="-20" x2="24" y2="-20" stroke="#c8a030" stroke-width="2"/>
    <line x1="-24" y1="-6" x2="24" y2="-6" stroke="#c8a030" stroke-width="2"/>
    <line x1="-24" y1="8" x2="14" y2="8" stroke="#c8a030" stroke-width="2"/>
    <text x="0" y="60" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#f5c518">PAPER</text>
  </g>
  <!-- Scissors -->
  <g transform="translate(440,155)">
    <!-- Blade 1 -->
    <ellipse cx="-15" cy="-20" rx="8" ry="28" fill="#53d769" transform="rotate(-20 -15 -20)"/>
    <!-- Blade 2 -->
    <ellipse cx="15" cy="-20" rx="8" ry="28" fill="#53d769" transform="rotate(20 15 -20)"/>
    <!-- Pivot -->
    <circle cx="0" cy="5" r="5" fill="#3da854"/>
    <!-- Handles -->
    <ellipse cx="-18" cy="28" rx="10" ry="8" fill="none" stroke="#53d769" stroke-width="3"/>
    <ellipse cx="18" cy="28" rx="10" ry="8" fill="none" stroke="#53d769" stroke-width="3"/>
    <text x="0" y="55" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#53d769">SCISSORS</text>
  </g>
  <!-- VS icons -->
  <text x="230" y="165" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff" opacity="0.5">VS</text>
  <text x="370" y="165" text-anchor="middle" font-family="monospace" font-size="18" font-weight="bold" fill="#fff" opacity="0.5">VS</text>
  <!-- CLI frame -->
  <g transform="translate(180,250)">
    <rect x="0" y="0" width="240" height="60" rx="6" fill="#0a0a1a" stroke="#53d769" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="16" rx="6" fill="#333"/>
    <circle cx="10" cy="8" r="3" fill="#e94560"/>
    <circle cx="20" cy="8" r="3" fill="#f5c518"/>
    <circle cx="30" cy="8" r="3" fill="#53d769"/>
    <text x="12" y="34" font-family="monospace" font-size="10" fill="#53d769">> rps --round 3</text>
    <text x="12" y="50" font-family="monospace" font-size="10" fill="#f5c518">You: Rock | CPU: Scissors</text>
  </g>
  <!-- Label -->
  <text x="300" y="340" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="#e94560">RkPprScisor</text>
  <text x="300" y="368" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">CLI Rock-Paper-Scissors</text>
</svg>