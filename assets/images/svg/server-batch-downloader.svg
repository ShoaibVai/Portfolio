<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <!-- Download arrow stack -->
  <g transform="translate(300,140)">
    <!-- Main arrow -->
    <polygon points="0,-50 30,-20 15,-20 15,30 -15,30 -15,-20 -30,-20" fill="#53d769"/>
    <!-- Base line -->
    <rect x="-35" y="30" width="70" height="8" rx="4" fill="#53d769"/>
  </g>
  <!-- Multiple file icons -->
  <g fill="#fff" opacity="0.85">
    <g transform="translate(190,120)">
      <rect x="0" y="0" width="40" height="50" rx="3" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
      <text x="20" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#e94560">FILE</text>
      <line x1="8" y1="30" x2="32" y2="30" stroke="#555" stroke-width="1.5"/>
      <line x1="8" y1="38" x2="26" y2="38" stroke="#555" stroke-width="1.5"/>
    </g>
    <g transform="translate(220,130)">
      <rect x="0" y="0" width="40" height="50" rx="3" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
      <text x="20" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#e94560">FILE</text>
      <line x1="8" y1="30" x2="32" y2="30" stroke="#555" stroke-width="1.5"/>
      <line x1="8" y1="38" x2="26" y2="38" stroke="#555" stroke-width="1.5"/>
    </g>
    <g transform="translate(250,120)">
      <rect x="0" y="0" width="40" height="50" rx="3" fill="#0f3460" stroke="#e94560" stroke-width="2"/>
      <text x="20" y="20" text-anchor="middle" font-family="monospace" font-size="8" fill="#e94560">FILE</text>
      <line x1="8" y1="30" x2="32" y2="30" stroke="#555" stroke-width="1.5"/>
      <line x1="8" y1="38" x2="26" y2="38" stroke="#555" stroke-width="1.5"/>
    </g>
  </g>
  <!-- Progress bars -->
  <g transform="translate(180,230)">
    <rect x="0" y="0" width="240" height="10" rx="5" fill="#0f3460"/>
    <rect x="0" y="0" width="180" height="10" rx="5" fill="#53d769"/>
    <text x="250" y="10" font-family="monospace" font-size="11" fill="#53d769">75%</text>
  </g>
  <g transform="translate(180,250)">
    <rect x="0" y="0" width="240" height="10" rx="5" fill="#0f3460"/>
    <rect x="0" y="0" width="120" height="10" rx="5" fill="#f5c518"/>
    <text x="250" y="10" font-family="monospace" font-size="11" fill="#f5c518">50%</text>
  </g>
  <g transform="translate(180,270)">
    <rect x="0" y="0" width="240" height="10" rx="5" fill="#0f3460"/>
    <rect x="0" y="0" width="220" height="10" rx="5" fill="#53d769"/>
    <text x="250" y="10" font-family="monospace" font-size="11" fill="#53d769">92%</text>
  </g>
  <!-- Label -->
  <text x="300" y="320" text-anchor="middle" font-family="monospace" font-size="22" font-weight="bold" fill="#e94560">server_batch_downloader</text>
  <text x="300" y="348" text-anchor="middle" font-family="monospace" font-size="14" fill="#a8a8a8">PyQt5 Batch Downloader</text>
</svg>